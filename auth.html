<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIIT Events | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    screens: {
                        'xs': '375px',
                        ...tailwind.config.theme.screens,
                    },
                    colors: {
                        primary: "#3B82F6",
                        "primary-hover": "#2563EB",
                        "background-light": "#F3F4F6",
                        "background-dark": "#0F172A",
                        "card-light": "#FFFFFF",
                        "card-dark": "#1E293B",
                        "input-light": "#F9FAFB",
                        "input-dark": "#111827",
                        "border-light": "#E5E7EB",
                        "border-dark": "#334155",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                        sans: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.75rem",
                        'xl': "1rem",
                        '2xl': "1.5rem",
                    },
                    boxShadow: {
                        'glow': '0 0 20px rgba(59, 130, 246, 0.5)',
                        'glow-sm': '0 0 10px rgba(59, 130, 246, 0.3)',
                    }
                },
            },
        };
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .bg-gradient-mesh-dark {
            background-color: #0F172A;
            background-image:
                radial-gradient(at 0% 0%, hsla(222, 87%, 55%, 0.3) 0px, transparent 50%),
                radial-gradient(at 100% 100%, hsla(263, 74%, 55%, 0.3) 0px, transparent 50%);
        }

        .bg-gradient-mesh-light {
            background-color: #F3F4F6;
            background-image:
                radial-gradient(at 0% 0%, hsla(217, 91%, 60%, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, hsla(263, 74%, 60%, 0.15) 0px, transparent 50%);
        }

        /* --- Custom Role selector styles to match new theme --- */
        .role-option {
            transition: all 0.2s ease;
        }

        .role-option.active {
            background-color: #3B82F6;
            color: white;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        /* Hide specific groups initially (managed by auth.js) */
        #confirmGroup,
        #roleGroup,
        #termsGroup,
        #nameGroup {
            display: none;
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark min-h-screen flex items-start md:items-center justify-center p-4 py-8 md:py-12 relative transition-colors duration-300">
    <div class="absolute inset-0 bg-gradient-mesh-light dark:bg-gradient-mesh-dark z-0 transition-opacity duration-300">
    </div>

    <button
        class="back-button fixed top-4 left-4 flex items-center gap-1 px-3 py-1.5 bg-white/10 backdrop-blur-md border border-white/20 rounded-full text-sm text-white/80 hover:text-white z-50 transition-all"
        onclick="goHome()" aria-label="Back to Home">
        <span class="material-icons-round text-lg">arrow_back</span>
        <span class="hidden xs:inline">Back</span>
    </button>

    <!-- Auth Card -->
    <div
        class="relative w-[92%] xs:w-full max-w-md mx-auto bg-card-light dark:bg-card-dark/60 dark:backdrop-blur-xl border border-border-light dark:border-white/10 shadow-2xl rounded-2xl p-5 xs:p-8 z-10 transition-colors duration-300">
        <div class="mb-6 md:mb-8 text-center md:text-left">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-900 dark:text-white mb-2" id="formTitle">Welcome Back
            </h1>
            <p class="text-gray-500 dark:text-gray-400 text-sm subtitle">Sign in to your KIIT Events account</p>
        </div>

        <form class="space-y-6" id="authForm">
            <!-- Name Input (Sign Up Only) -->
            <div class="space-y-2" id="nameGroup">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300" for="name">Full Name</label>
                <div class="relative">
                    <input
                        class="w-full px-4 py-3 bg-input-light dark:bg-input-dark border border-gray-300 dark:border-border-dark rounded-xl text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all shadow-sm"
                        id="name" placeholder="Your full name" type="text" />
                </div>
            </div>

            <!-- Email Input -->
            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300" for="email">Email</label>
                <div class="relative">
                    <input
                        class="w-full px-4 py-3 bg-input-light dark:bg-input-dark border border-gray-300 dark:border-border-dark rounded-xl text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all shadow-sm"
                        id="email" name="email" placeholder="rollno@kiit.ac.in" required="" type="email" />
                </div>
            </div>

            <!-- Password Input -->
            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300"
                    for="password">Password</label>
                <div class="relative">
                    <input
                        class="w-full px-4 py-3 bg-input-light dark:bg-input-dark border border-gray-300 dark:border-border-dark rounded-xl text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all shadow-sm pr-10"
                        id="password" name="password" placeholder="••••••••" required="" type="password" />
                    <button
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 cursor-pointer focus:outline-none"
                        type="button" onclick="togglePassword()">
                        <span class="material-icons-round text-xl">visibility</span>
                    </button>
                </div>
            </div>

            <!-- Confirm Password (Sign Up Only) -->
            <div class="space-y-2" id="confirmGroup">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300" for="confirmPassword">Confirm
                    Password</label>
                <div class="relative">
                    <input
                        class="w-full px-4 py-3 bg-input-light dark:bg-input-dark border border-gray-300 dark:border-border-dark rounded-xl text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all shadow-sm"
                        id="confirmPassword" type="password" />
                </div>
            </div>

            <!-- Role Selection (Sign Up Only) -->
            <div class="space-y-2" id="roleGroup">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Join as</label>
                <div class="flex gap-2 p-1 bg-input-light dark:bg-input-dark border border-gray-300 dark:border-border-dark rounded-xl"
                    id="roleSelector">
                    <button type="button"
                        class="role-option active flex-1 py-2 px-1 xs:px-3 rounded-lg text-[10px] xs:text-sm font-medium text-gray-600 dark:text-gray-400 flex items-center justify-center gap-1 xs:gap-2"
                        data-role="student">
                        <span class="material-icons-round text-sm xs:text-lg">school</span>
                        Student
                    </button>
                    <button type="button"
                        class="role-option flex-1 py-2 px-1 xs:px-3 rounded-lg text-[10px] xs:text-sm font-medium text-gray-600 dark:text-gray-400 flex items-center justify-center gap-1 xs:gap-2"
                        data-role="admin">
                        <span class="material-icons-round text-sm xs:text-lg">security</span>
                        Admin
                    </button>
                </div>
            </div>

            <!-- Terms (Sign Up Only) -->
            <div class="flex items-center gap-3" id="termsGroup">
                <input type="checkbox" id="terms"
                    class="w-5 h-5 rounded border-gray-300 text-primary focus:ring-primary">
                <label for="terms" class="text-sm text-gray-600 dark:text-gray-400">I agree to Terms &
                    Conditions</label>
            </div>

            <button
                class="btn w-full bg-primary hover:bg-blue-600 text-white font-semibold py-3 px-4 rounded-xl shadow-lg hover:shadow-glow transition-all duration-200 transform hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary dark:focus:ring-offset-background-dark"
                type="submit" id="authSubmitBtn">
                Sign In
            </button>
        </form>

        <div class="relative my-8">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-gray-200 dark:border-gray-700"></div>
            </div>
            <div class="relative flex justify-center text-sm">
                <span class="px-2 bg-card-light dark:bg-card-dark text-gray-500 dark:text-gray-400 rounded">OR</span>
            </div>
        </div>

        <!-- Google Login -->
        <button
            class="google-btn w-full bg-white dark:bg-white text-gray-700 dark:text-gray-900 font-semibold py-3 px-4 rounded-xl border border-gray-200 dark:border-gray-300 shadow-sm hover:bg-gray-50 dark:hover:bg-gray-100 transition-all duration-200 flex items-center justify-center gap-3"
            type="button" onclick="signInWithGoogle(event)">
            <svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                    fill="#4285F4"></path>
                <path
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                    fill="#34A853"></path>
                <path
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                    fill="#FBBC05"></path>
                <path
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                    fill="#EA4335"></path>
            </svg>
            Sign in with Google
        </button>

        <p class="mt-8 text-center text-sm text-gray-500 dark:text-gray-400 auth-toggle-text">
            Don't have an account?
            <a class="font-medium text-primary hover:text-blue-500 dark:hover:text-blue-400 transition-colors" href="#"
                id="toggleAuthMode">Sign Up</a>
        </p>
    </div>

    <!-- Theme Toggle -->
    <button
        class="fixed bottom-6 right-6 p-3 rounded-full bg-white/90 dark:bg-slate-800 text-gray-800 dark:text-yellow-400 shadow-xl border border-gray-200 dark:border-gray-700 z-50 transition-all hover:scale-110 active:scale-95 md:bottom-8 md:right-8"
        id="theme-toggle">
        <span class="material-icons-round" id="theme-icon">dark_mode</span>
    </button>

    <!-- Scripts -->
    <script>
        // Theme toggle logic
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const html = document.documentElement;

        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
            themeIcon.textContent = 'light_mode';
        } else {
            html.classList.remove('dark');
            themeIcon.textContent = 'dark_mode';
        }

        themeToggleBtn.addEventListener('click', () => {
            html.classList.toggle('dark');
            if (html.classList.contains('dark')) {
                localStorage.theme = 'dark';
                themeIcon.textContent = 'light_mode';
            } else {
                localStorage.theme = 'light';
                themeIcon.textContent = 'dark_mode';
            }
        });
    </script>

    <script type="module" src="supabase.js"></script>
    <script type="module">
        import { supabase } from "./supabase.js";
        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.replace("auth-callback.html");
            }
        });
    </script>
    <!-- Your app scripts (Module based) -->
    <script type="module" src="auth.js?v=3"></script>
</body>

</html>
